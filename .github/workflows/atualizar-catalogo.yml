name: Atualizar catálogo e publicar mapa

on:
  push:
    branches: [main]
    paths:
      - 'grupos/**'
      - 'scripts/gerar-catalogo.mjs'
      - '.github/workflows/atualizar-catalogo.yml'
      - 'index.html'
      - 'js/**'
      - 'css/**'
      - 'divisaoadm/**'
  workflow_dispatch:

concurrency:
  group: mapa-pages
  cancel-in-progress: false

jobs:
  catalogo:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gerar e validar catálogo
        run: |
          node scripts/gerar-catalogo.mjs
          node scripts/gerar-catalogo.mjs --check
          while IFS= read -r -d '' arquivo; do
            node --check "$arquivo"
          done < <(find js scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0)
      - name: Salvar catálogo atualizado
        run: |
          git add grupos/catalogo.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Atualiza catálogo de parcerias'
            git push origin HEAD:main
          fi
      - name: Preparar site estático
        run: |
          mkdir _site
          cp index.html _site/
          cp -r css js divisaoadm grupos _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: catalogo
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
