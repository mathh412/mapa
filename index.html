<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Interativo - São Paulo</title>
    
    <!-- CSS do Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ededed;
            overflow: hidden;
        }
        
        #map { 
            width: 100%; height: 100%; background-color: #ededed;
            cursor: default;
        }

        .leaflet-tooltip {
            background-color: #2b2b2b; color: #ffffff;
            border: 1px solid #444; font-weight: bold;
        }
        .leaflet-tooltip-top:before, .leaflet-tooltip-bottom:before,
        .leaflet-tooltip-left:before, .leaflet-tooltip-right:before {
            border-color: transparent !important;
        }

        .badge-ceu {
            background-color: #F08200; color: white; font-weight: bold;
            font-size: 14px; border: 2px solid #fff; border-radius: 50%;
            text-align: center; line-height: 26px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- JS do Leaflet e do Turf.js (Matemática Espacial) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>

    <script>
        // 1. Dicionário de Mapeamento (De-Para)
        const deParaDistritos = {
            "Água Rasa": "Mooca", "Alto de Pinheiros": "Pinheiros", "Anhanguera": "Perus",
            "Aricanduva": "Aricanduva", "Artur Alvim": "Penha", "Barra Funda": "Lapa",
            "Bela Vista": "Sé", "Belém": "Mooca", "Bom Retiro": "Sé", "Brás": "Mooca",
            "Brasilândia": "Freguesia do Ó", "Butantã": "Butantã", "Cachoeirinha": "Casa Verde",
            "Cambuci": "Sé", "Campo Belo": "Santo Amaro", "Campo Grande": "Santo Amaro",
            "Campo Limpo": "Campo Limpo", "Cangaiba": "Penha", "Capão Redondo": "Campo Limpo",
            "Carrão": "Aricanduva", "Casa Verde": "Casa Verde", "Cidade Ademar": "Cidade Ademar",
            "Cidade Dutra": "Capela do Socorro", "Cidade Líder": "Itaquera", "Cidade Tiradentes": "Cidade Tiradentes",
            "Consolação": "Sé", "Cursino": "Ipiranga", "Ermelino Matarazzo": "Ermelino Matarazzo",
            "Freguesia do Ó": "Freguesia do Ó", "Grajaú": "Capela do Socorro", "Guaianases": "Guaianases",
            "Iguatemi": "São Mateus", "Ipiranga": "Ipiranga", "Itaim Bibi": "Pinheiros",
            "Itaim Paulista": "Itaim Paulista", "Itaquera": "Itaquera", "Jabaquara": "Jabaquara",
            "Jaçanã": "Jaçanã", "Jaguara": "Lapa", "Jaguaré": "Lapa", "Jaraguá": "Pirituba",
            "Jardim Ângela": "MBoi Mirim", "Jardim Helena": "São Miguel", "Jardim Paulista": "Pinheiros",
            "Jardim São Luís": "MBoi Mirim", "José Bonifácio": "Itaquera", "Lajeado": "Guaianases",
            "Lapa": "Lapa", "Liberdade": "Sé", "Limão": "Casa Verde", "Mandaqui": "Santana",
            "Marsilac": "Parelheiros", "Moema": "Vila Mariana", "Mooca": "Mooca", "Morumbi": "Butantã",
            "Parelheiros": "Parelheiros", "Pari": "Mooca", "Parque do Carmo": "Itaquera",
            "Pedreira": "Cidade Ademar", "Penha": "Penha", "Perdizes": "Lapa", "Perus": "Perus",
            "Pinheiros": "Pinheiros", "Pirituba": "Pirituba", "Ponte Rasa": "Ermelino Matarazzo",
            "Raposo Tavares": "Butantã", "República": "Sé", "Rio Pequeno": "Butantã",
            "Sacomã": "Ipiranga", "Santa Cecília": "Sé", "Santana": "Santana",
            "Santo Amaro": "Santo Amaro", "São Domingos": "Pirituba", "São Lucas": "Vila Prudente",
            "São Mateus": "São Mateus", "São Miguel": "São Miguel", "São Rafael": "São Mateus",
            "Sapopemba": "Sapopemba", "Saúde": "Vila Mariana", "Sé": "Sé",
            "Socorro": "Capela do Socorro", "Tatuapé": "Mooca", "Tremembé": "Jaçanã",
            "Tucuruvi": "Santana", "Vila Andrade": "Campo Limpo", "Vila Curuçá": "Itaim Paulista",
            "Vila Formosa": "Aricanduva", "Vila Guilherme": "Vila Maria-Vila Guilherme",
            "Vila Jacuí": "São Miguel", "Vila Leopoldina": "Lapa", "Vila Maria": "Vila Maria-Vila Guilherme",
            "Vila Mariana": "Vila Mariana", "Vila Matilde": "Penha", "Vila Medeiros": "Vila Maria-Vila Guilherme",
            "Vila Prudente": "Vila Prudente", "Vila Sônia": "Butantã"
        };

        const deParaDistritosLower = {};
        for (const chave in deParaDistritos) {
            deParaDistritosLower[chave.toLowerCase()] = deParaDistritos[chave];
        }

        function buscarSubprefeitura(nomeDistrito) {
            if (!nomeDistrito) return undefined;
            return deParaDistritos[nomeDistrito] || deParaDistritosLower[nomeDistrito.toLowerCase()];
        }

        let distritosCanonicos = {};
        function buscarNomeCanonicoDistrito(nome) {
            if (!nome) return null;
            return distritosCanonicos[nome.toLowerCase()] || null;
        }

        // 2. Inicialização do Mapa Base
        const map = L.map('map').setView([-23.5505, -46.6333], 10);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
        }).addTo(map);

        const urlSubprefeituras = 'subprefeituras.geojson'; 
        const urlDistritos = 'distritos.geojson';
        const corAzul = "#00506E";

        function estiloSubprefeitura(feature) {
            const nomeSub = feature.properties.name;
            const temCeu = (contagemSub[nomeSub] || 0) > 0;
            return temCeu
                ? { color: corAzul, weight: 1.5, fillColor: corAzul, fillOpacity: 0.35 }
                : { color: corAzul, weight: 1, fillColor: corAzul, fillOpacity: 0 };
        }
        function estiloDistrito(feature) {
            const nomeDistrito = feature.properties.nm_distrito_municipal;
            const temCeu = (contagemDist[nomeDistrito] || 0) > 0;
            return temCeu
                ? { color: corAzul, weight: 1.5, fillColor: corAzul, fillOpacity: 0.35 }
                : { color: corAzul, weight: 1, fillColor: corAzul, fillOpacity: 0 };
        }
        function estiloSubHover(feature) {
            const base = estiloSubprefeitura(feature);
            return { ...base, weight: 3, fillOpacity: Math.max(base.fillOpacity, 0.15) + 0.15 };
        }
        function estiloDistHover(feature) {
            const base = estiloDistrito(feature);
            return { ...base, weight: 3, fillOpacity: Math.max(base.fillOpacity, 0.15) + 0.15 };
        }

        // Variáveis de Estado
        let currentState = 0; 
        let boundsSubprefeituraAtual = null;
        let subprefeituraAtual = null;

        let subprefeiturasLayer, distritosLayer;
        let distritosGeoJSON = null; 
        
        let badgesSub = L.layerGroup().addTo(map);
        let badgesDist = L.layerGroup();
        let pinsCeu = L.layerGroup();
        let popupAtual = null; 
        
        let ceusData = []; 
        let contagemSub = {};
        let contagemDist = {};
        let primeiraRenderizacao = true; 

        let mensagemPendente = null;
        let geoJSONPronto = false;

        function criarBadgeIcon(numero) {
            return L.divIcon({
                className: 'custom-icon', html: `<div class="badge-ceu">${numero}</div>`,
                iconSize: [30, 30], iconAnchor: [15, 15] 
            });
        }

        // UNIFICADO: Processa usando Lat/Long primeiro. Se falhar ou faltar dados, usa o Distrito Direto.
        function processarDadosCEUs(dados) {
            ceusData = dados;
            contagemSub = {};
            contagemDist = {};
            const naoLocalizados = [];

            if (!distritosGeoJSON) return;

            ceusData.forEach(ceu => {
                let nomeCanonico = null;

                // TENTATIVA 1: Lat/Long via Turf.js (Prioridade Geométrica)
                if (ceu.lat && ceu.lng) {
                    const pt = turf.point([ceu.lng, ceu.lat]); 
                    let encontrado = false;

                    for (let feature of distritosGeoJSON.features) {
                        if (turf.booleanPointInPolygon(pt, feature)) {
                            nomeCanonico = feature.properties.nm_distrito_municipal;
                            encontrado = true;
                            break; 
                        }
                    }

                    // Fallback Geométrico: pega o distrito mais próximo se cair um pouco fora das bordas
                    if (!encontrado) {
                        let menorDistancia = Infinity;
                        for (let feature of distritosGeoJSON.features) {
                            try {
                                const centro = turf.centroid(feature);
                                const dist = turf.distance(pt, centro);
                                if (dist < menorDistancia) {
                                    menorDistancia = dist;
                                    nomeCanonico = feature.properties.nm_distrito_municipal;
                                }
                            } catch (e) {}
                        }
                    }
                }

                // TENTATIVA 2: Fallback para "Distrito Direto" se não achou por coordenadas
                if (!nomeCanonico && ceu.distrito) {
                    nomeCanonico = buscarNomeCanonicoDistrito(ceu.distrito);
                }

                // Aplica contagens se encontrou o distrito por qualquer método
                if (nomeCanonico) {
                    ceu.distrito = nomeCanonico; 
                    ceu.subprefeitura = buscarSubprefeitura(nomeCanonico);

                    contagemDist[nomeCanonico] = (contagemDist[nomeCanonico] || 0) + 1;
                    if (ceu.subprefeitura) {
                        contagemSub[ceu.subprefeitura] = (contagemSub[ceu.subprefeitura] || 0) + 1;
                    } else {
                        naoLocalizados.push(`${ceu.nome || "?"} (distrito '${nomeCanonico}' sem subprefeitura no de-para)`);
                    }
                } else {
                    naoLocalizados.push(`${ceu.nome || "?"} (falha ao localizar por lat/long e nome direto)`);
                }
            });

            mostrarAvisoNaoLocalizados(naoLocalizados);

            if (currentState === 0) { renderizarSubprefeituras(); } 
            else if (currentState === 1) { renderizarDistritos(subprefeituraAtual); }
        }

        function mostrarAvisoNaoLocalizados(lista) {
            if (lista.length > 0) console.warn('[CEUs não localizados]', lista);
            let aviso = document.getElementById('avisoNaoLocalizados');
            
            if (lista.length === 0) {
                if (aviso) aviso.remove();
                return;
            }
            
            if (!aviso) {
                aviso = document.createElement('div');
                aviso.id = 'avisoNaoLocalizados';
                aviso.style.cssText = 'position:absolute; top:8px; left:8px; z-index:9999; background:#c0392b; color:#fff; font-family:sans-serif; font-size:12px; padding:8px 10px; border-radius:6px; max-width:80%;';
                document.body.appendChild(aviso);
            }
            aviso.textContent = 'CEU(s) não localizado(s): ' + lista.join(' | ');
        }

        async function carregarArquivosGeoJSON() {
            try {
                const resDist = await fetch(urlDistritos);
                distritosGeoJSON = await resDist.json();

                // Popula o índice de nomes canônicos para busca direta
                distritosGeoJSON.features.forEach(feature => {
                    const nome = feature.properties.nm_distrito_municipal;
                    if (nome) distritosCanonicos[nome.toLowerCase()] = nome;
                });

                geoJSONPronto = true;
                renderizarSubprefeituras(); 

                if (mensagemPendente) {
                    processarDadosCEUs(mensagemPendente);
                    mensagemPendente = null;
                }

                const params = new URLSearchParams(window.location.search);
                const dadosParam = params.get('dados');
                if (dadosParam) {
                    try {
                        const dadosTeste = JSON.parse(dadosParam);
                        processarDadosCEUs(dadosTeste);
                    } catch (e) {
                        console.error('[MODO TESTE] Erro:', e);
                    }
                }
            } catch(e) {
                console.error("Erro ao carregar arquivos GeoJSON locais:", e);
            }
        }

        carregarArquivosGeoJSON();

        window.addEventListener('message', function(event) {
            if (event.data && Array.isArray(event.data)) {
                if (geoJSONPronto) {
                    processarDadosCEUs(event.data);
                } else {
                    mensagemPendente = event.data;
                }
            }
        });

        function renderizarSubprefeituras() {
            fetch(urlSubprefeituras)
                .then(res => res.json())
                .then(data => {
                    if (subprefeiturasLayer) { map.removeLayer(subprefeiturasLayer); }
                    badgesSub.clearLayers();

                    subprefeiturasLayer = L.geoJSON(data, {
                        style: estiloSubprefeitura,
                        onEachFeature: function (feature, layer) {
                            layer.on('mouseover', () => layer.setStyle(estiloSubHover(feature)));
                            layer.on('mouseout', () => subprefeiturasLayer.resetStyle(layer));

                            const nomeSub = feature.properties.name; 
                            const totalCeus = contagemSub[nomeSub] || 0;
                            if (totalCeus > 0) {
                                const centro = layer.getBounds().getCenter();
                                L.marker(centro, { icon: criarBadgeIcon(totalCeus), interactive: false }).addTo(badgesSub);
                            }

                            layer.on('click', function (e) {
                                L.DomEvent.stopPropagation(e);
                                subprefeituraAtual = nomeSub;
                                boundsSubprefeituraAtual = e.target.getBounds();
                                
                                map.removeLayer(subprefeiturasLayer);
                                badgesSub.removeFrom(map);
                                map.fitBounds(boundsSubprefeituraAtual);

                                renderizarDistritos(nomeSub);
                            });
                            
                            layer.bindTooltip(nomeSub || "Subprefeitura", { sticky: true, className: 'dark-tooltip' });
                        }
                    }).addTo(map);

                    if (primeiraRenderizacao) {
                        map.fitBounds(subprefeiturasLayer.getBounds(), { padding: [20, 20] });
                        primeiraRenderizacao = false;
                    }
                })
                .catch(err => console.error("Erro ao renderizar Subprefeituras:", err));
        }

        function renderizarDistritos(nomeSubprefeituraClicada) {
            currentState = 1;
            if (distritosLayer) { map.removeLayer(distritosLayer); }
            badgesDist.clearLayers();

            distritosLayer = L.geoJSON(distritosGeoJSON, {
                filter: function(feature) {
                    const nomeDistrito = feature.properties.nm_distrito_municipal; 
                    const subprefeituraDesteDistrito = buscarSubprefeitura(nomeDistrito);
                    return subprefeituraDesteDistrito === nomeSubprefeituraClicada; 
                },
                style: estiloDistrito,
                onEachFeature: function (feature, layer) {
                    layer.on('mouseover', () => layer.setStyle(estiloDistHover(feature)));
                    layer.on('mouseout', () => distritosLayer.resetStyle(layer));

                    const nomeDistrito = feature.properties.nm_distrito_municipal;
                    const totalCeus = contagemDist[nomeDistrito] || 0;
                    
                    if (totalCeus > 0) {
                        const centro = layer.getBounds().getCenter();
                        L.marker(centro, { icon: criarBadgeIcon(totalCeus), interactive: false }).addTo(badgesDist);
                    }

                    layer.on('click', function (e) {
                        L.DomEvent.stopPropagation(e);
                        if (totalCeus > 0) {
                            mostrarPins(nomeDistrito, e.target.getBounds());
                        } else {
                            map.fitBounds(e.target.getBounds());
                        }
                    });
                    
                    layer.bindTooltip(nomeDistrito || "Distrito", { sticky: true });
                }
            }).addTo(map);
            badgesDist.addTo(map);
        }

        // UNIFICADO: Mostra Pins (se houver coord) E abre um Popup com a Lista como complemento
        function mostrarPins(nomeDistrito, boundsDistrito) {
            currentState = 2;
            badgesDist.removeFrom(map);
            map.fitBounds(boundsDistrito);
            pinsCeu.clearLayers();

            const ceusDesteDistrito = ceusData.filter(ceu => ceu.distrito === nomeDistrito);
            let gerouPin = false;

            ceusDesteDistrito.forEach(ceu => {
                if (ceu.lat && ceu.lng) {
                    const marker = L.marker([ceu.lat, ceu.lng]).addTo(pinsCeu);
                    marker.bindPopup(`<strong style="color:#000;">${ceu.nome || 'CEU'}</strong><br><span style="color:#333;">${ceu.distrito}</span>`);
                    gerouPin = true;
                }
            });

            if (gerouPin) {
                pinsCeu.addTo(map);
            } else {
                // Se nenhum CEU da área tiver coordenada, exibe a lista no centro do distrito
                const listaHtml = 
                    '<strong style="color:#000;">' + nomeDistrito + '</strong><br>' +
                    '<ul style="margin:4px 0 0 -18px; padding:0; color:#333;">' +
                    ceusDesteDistrito.map(ceu => '<li>' + (ceu.nome || 'CEU') + '</li>').join('') +
                    '</ul>';

                popupAtual = L.popup({ closeButton: true, autoClose: false, closeOnClick: false })
                    .setLatLng(boundsDistrito.getCenter())
                    .setContent(listaHtml)
                    .openOn(map);
            }
        }

        // Voltar ao clicar no fundo
        map.on('click', function () {
            if (currentState === 2) {
                currentState = 1;
                if (popupAtual) { map.closePopup(popupAtual); popupAtual = null; }
                map.removeLayer(pinsCeu); // Limpa os pins, se existirem
                badgesDist.addTo(map);
                map.fitBounds(boundsSubprefeituraAtual);
            } else if (currentState === 1) {
                currentState = 0;
                if (distritosLayer) { map.removeLayer(distritosLayer); }
                badgesDist.removeFrom(map);
                subprefeiturasLayer.addTo(map);
                badgesSub.addTo(map);
                map.fitBounds(subprefeiturasLayer.getBounds(), { padding: [20, 20] });
            }
        });
    </script>
</body>
</html>
