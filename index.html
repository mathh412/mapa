<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">


    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >


    <title>
        Mapa Interativo - São Paulo
    </title>


    <!-- =====================================================
         LEAFLET
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >


    <!-- =====================================================
         MAPA
    ====================================================== -->

    <link
        rel="stylesheet"
        href="./css/mapa.css"
    >

</head>


<body>


    <!-- =====================================================
         CARREGAMENTO
    ====================================================== -->

    <div id="loading">

        Carregando dados geográficos da nuvem...

    </div>


    <!-- =====================================================
         INDICADOR DE CAMADA
    ====================================================== -->

    <div
        id="indicador-camada"
        style="display:none"
    >

        Camada Atual: Regiões

    </div>


    <!-- =====================================================
         MAPA
    ====================================================== -->

    <div id="map"></div>


    <!-- =====================================================
         LEAFLET
    ====================================================== -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    ></script>


    <!-- =====================================================
         TURF
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"
    ></script>


    <!-- =====================================================
         MOTOR DO MAPA
    ====================================================== -->

    <script
        src="./js/mapa.js"
    ></script>


    <!-- =====================================================
         CONTROLE PERSISTENTE DE NÍVEL
    ====================================================== -->

    <script
        src="./js/nivel-persistente.js"
    ></script>


    <!-- =====================================================
         INTEGRAÇÃO ANALÍTICA COM O DASHBOARD
    ====================================================== -->

    <script
        src="./js/bridge-analitico.js"
    ></script>


</body>

</html>
