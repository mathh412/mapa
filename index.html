<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Interativo - São Paulo</title>
    
    <!-- CSS do Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ededed;
            overflow: hidden;
        }
        
        #map { 
            width: 100%; height: 100%; background-color: #ededed;
            cursor: default;
        }

        .leaflet-tooltip {
            background-color: #2b2b2b; color: #ffffff;
            border: 1px solid #444; font-weight: bold;
        }
        .leaflet-tooltip-top:before, .leaflet-tooltip-bottom:before,
        .leaflet-tooltip-left:before, .leaflet-tooltip-right:before {
            border-color: transparent !important;
        }

        /* Estilo 1: Bolinha Simples (Modo Detalhado) */
        .badge-ceu {
            background-color: #F08200; color: white; font-weight: bold;
            font-size: 14px; border: 2px solid #fff; border-radius: 50%;
            text-align: center; line-height: 26px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        /* Estilo 2: Etiqueta Dupla (Modo Gerencial) - TAMANHO REDUZIDO */
        .badge-gerencial {
            background-color: #2b2b2b; color: white; font-weight: bold;
            font-size: 11px; /* Fonte menor */
            border: 1.5px solid #fff; border-radius: 20px;
            padding: 2px 6px; /* Bordas mais enxutas */
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            display: flex; justify-content: center; gap: 5px; /* Menos espaçamento interno */
            white-space: nowrap;
        }
        .icone-equip { color: #4CAF50; } 
        .icone-parc { color: #F08200; }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- JS do Leaflet e do Turf.js -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>

    <script>
        // 1. Dicionário de Mapeamento (De-Para)
        const deParaDistritos = {
            "Água Rasa": "Mooca", "Alto de Pinheiros": "Pinheiros", "Anhanguera": "Perus",
            "Aricanduva": "Aricanduva", "Artur Alvim": "Penha", "Barra Funda": "Lapa",
            "Bela Vista": "Sé", "Belém": "Mooca", "Bom Retiro": "Sé", "Brás": "Mooca",
            "Brasilândia": "Freguesia do Ó", "Butantã": "Butantã", "Cachoeirinha": "Casa Verde",
            "Cambuci": "Sé", "Campo Belo": "Santo Amaro", "Campo Grande": "Santo Amaro",
            "Campo Limpo": "Campo Limpo", "Cangaiba": "Penha", "Capão Redondo": "Campo Limpo",
            "Carrão": "Aricanduva", "Casa Verde": "Casa Verde", "Cidade Ademar": "Cidade Ademar",
            "Cidade Dutra": "Capela do Socorro", "Cidade Líder": "Itaquera", "Cidade Tiradentes": "Cidade Tiradentes",
            "Consolação": "Sé", "Cursino": "Ipiranga", "Ermelino Matarazzo": "Ermelino Matarazzo",
            "Freguesia do Ó": "Freguesia do Ó", "Grajaú": "Capela do Socorro", "Guaianases": "Guaianases",
            "Iguatemi": "São Mateus", "Ipiranga": "Ipiranga", "Itaim Bibi": "Pinheiros",
            "Itaim Paulista": "Itaim Paulista", "Itaquera": "Itaquera", "Jabaquara": "Jabaquara",
            "Jaçanã": "Jaçanã", "Jaguara": "Lapa", "Jaguaré": "Lapa", "Jaraguá": "Pirituba",
            "Jardim Ângela": "MBoi Mirim", "Jardim Helena": "São Miguel", "Jardim Paulista": "Pinheiros",
            "Jardim São Luís": "MBoi Mirim", "José Bonifácio": "Itaquera", "Lajeado": "Guaianases",
            "Lapa": "Lapa", "Liberdade": "Sé", "Limão": "Casa Verde", "Mandaqui": "Santana",
            "Marsilac": "Parelheiros", "Moema": "Vila Mariana", "Mooca": "Mooca", "Morumbi": "Butantã",
            "Parelheiros": "Parelheiros", "Pari": "Mooca", "Parque do Carmo": "Itaquera",
            "Pedreira": "Cidade Ademar", "Penha": "Penha", "Perdizes": "Lapa", "Perus": "Perus",
            "Pinheiros": "Pinheiros", "Pirituba": "Pirituba", "Ponte Rasa": "Ermelino Matarazzo",
            "Raposo Tavares": "Butantã", "República": "Sé", "Rio Pequeno": "Butantã",
            "Sacomã": "Ipiranga", "Santa Cecília": "Sé", "Santana": "Santana",
            "Santo Amaro": "Santo Amaro", "São Domingos": "Pirituba", "São Lucas": "Vila Prudente",
            "São Mateus": "São Mateus", "São Miguel": "São Miguel", "São Rafael": "São Mateus",
            "Sapopemba": "Sapopemba", "Saúde": "Vila Mariana", "Sé": "Sé",
            "Socorro": "Capela do Socorro", "Tatuapé": "Mooca", "Tremembé": "Jaçanã",
            "Tucuruvi": "Santana", "Vila Andrade": "Campo Limpo", "Vila Curuçá": "Itaim Paulista",
            "Vila Formosa": "Aricanduva", "Vila Guilherme": "Vila Maria-Vila Guilherme",
            "Vila Jacuí": "São Miguel", "Vila Leopoldina": "Lapa", "Vila Maria": "Vila Maria-Vila Guilherme",
            "Vila Mariana": "Vila Mariana", "Vila Matilde": "Penha", "Vila Medeiros": "Vila Maria-Vila Guilherme",
            "Vila Prudente": "Vila Prudente", "Vila Sônia": "Butantã"
        };

        const deParaDistritosLower = {};
        for (const chave in deParaDistritos) { deParaDistritosLower[chave.toLowerCase()] = deParaDistritos[chave]; }
        function buscarSubprefeitura(nome) { return nome ? deParaDistritos[nome] || deParaDistritosLower[nome.toLowerCase()] : undefined; }
        
        let distritosCanonicos = {};
        function buscarNomeCanonicoDistrito(nome) { return nome ? distritosCanonicos[nome.toLowerCase()] || null : null; }

        // 2. Map Base (Nível inicial de zoom definido, mas sobreposto pelo fitBounds)
        const map = L.map('map').setView([-23.5505, -46.6333], 11);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);

        const urlSubprefeituras = 'subprefeituras.geojson'; 
        const urlDistritos = 'distritos.geojson';
        const corAzul = "#00506E";

        // Variáveis de Estado
        let currentState = 0; 
        let boundsSubprefeituraAtual = null;
        let subprefeituraAtual = null;
        let subprefeiturasLayer, distritosLayer;
        let distritosGeoJSON = null; 
        
        let badgesSub = L.layerGroup().addTo(map);
        let badgesDist = L.layerGroup();
        let pinsCeu = L.layerGroup();
        let popupAtual = null; 
        
        let ceusData = []; 
        let contagemSub = {};
        let contagemDist = {};
        let primeiraRenderizacao = true; 
        let geoJSONPronto = false;
        let mensagemPendente = null;

        let modoVisualizacao = 'detalhado'; // pode ser 'detalhado' ou 'gerencial'

        function temDadosNoLocal(stats) {
            if (!stats) return false;
            return (stats.total > 0) || (stats.equip > 0 || stats.parc > 0);
        }

        function estiloRegiao(feature, ehSubprefeitura) {
            const nome = ehSubprefeitura ? feature.properties.name : feature.properties.nm_distrito_municipal;
            const stats = ehSubprefeitura ? contagemSub[nome] : contagemDist[nome];
            const ativo = temDadosNoLocal(stats);
            return ativo 
                ? { color: corAzul, weight: 1.5, fillColor: corAzul, fillOpacity: 0.35 }
                : { color: corAzul, weight: 1, fillColor: corAzul, fillOpacity: 0 };
        }
        function estiloHover(feature, ehSubprefeitura) {
            const base = estiloRegiao(feature, ehSubprefeitura);
            return { ...base, weight: 3, fillOpacity: Math.max(base.fillOpacity, 0.15) + 0.15 };
        }

        function criarBadgeIcon(stats) {
            if (modoVisualizacao === 'gerencial') {
                return L.divIcon({
                    className: 'custom-icon', 
                    html: `
                        <div class="badge-gerencial">
                            <span class="icone-equip" title="Equipamentos">🏢 ${stats.equip || 0}</span>
                            <span style="color:#666">|</span>
                            <span class="icone-parc" title="Parcerias">🤝 ${stats.parc || 0}</span>
                        </div>`,
                    // DIMENSÕES REDUZIDAS para acompanhar o novo CSS
                    iconSize: [66, 24], 
                    iconAnchor: [33, 12] 
                });
            } else {
                return L.divIcon({
                    className: 'custom-icon', 
                    html: `<div class="badge-ceu">${stats.total || 0}</div>`,
                    iconSize: [30, 30], iconAnchor: [15, 15] 
                });
            }
        }

        function processarDadosCEUs(dados) {
            ceusData = dados;
            contagemSub = {};
            contagemDist = {};
            const naoLocalizados = [];

            if (!distritosGeoJSON || ceusData.length === 0) return;

            // Auto-Detecção do Modo
            if (ceusData[0].equipamentos !== undefined || ceusData[0].parcerias !== undefined) {
                modoVisualizacao = 'gerencial';
            } else {
                modoVisualizacao = 'detalhado';
            }

            ceusData.forEach(dado => {
                let nomeCanonico = null;

                if (modoVisualizacao === 'detalhado') {
                    if (dado.lat && dado.lng) {
                        const pt = turf.point([dado.lng, dado.lat]); 
                        for (let f of distritosGeoJSON.features) {
                            if (turf.booleanPointInPolygon(pt, f)) {
                                nomeCanonico = f.properties.nm_distrito_municipal; break; 
                            }
                        }
                        if (!nomeCanonico) {
                            let menorDist = Infinity;
                            for (let f of distritosGeoJSON.features) {
                                try {
                                    const dist = turf.distance(pt, turf.centroid(f));
                                    if (dist < menorDist) { menorDist = dist; nomeCanonico = f.properties.nm_distrito_municipal; }
                                } catch (e) {}
                            }
                        }
                    }
                    if (!nomeCanonico && dado.distrito) nomeCanonico = buscarNomeCanonicoDistrito(dado.distrito);

                    if (nomeCanonico) {
                        dado.distrito = nomeCanonico; 
                        let sub = buscarSubprefeitura(nomeCanonico);

                        if (!contagemDist[nomeCanonico]) contagemDist[nomeCanonico] = { total: 0 };
                        contagemDist[nomeCanonico].total += 1;

                        if (sub) {
                            if (!contagemSub[sub]) contagemSub[sub] = { total: 0 };
                            contagemSub[sub].total += 1;
                        }
                    } else {
                        naoLocalizados.push(`${dado.nome || "?"}`);
                    }
                } 
                else {
                    if (dado.distrito) nomeCanonico = buscarNomeCanonicoDistrito(dado.distrito);
                    
                    if (nomeCanonico) {
                        let sub = buscarSubprefeitura(nomeCanonico);
                        
                        if (!contagemDist[nomeCanonico]) contagemDist[nomeCanonico] = { equip: 0, parc: 0 };
                        contagemDist[nomeCanonico].equip += (dado.equipamentos || 0);
                        contagemDist[nomeCanonico].parc += (dado.parcerias || 0);

                        if (sub) {
                            if (!contagemSub[sub]) contagemSub[sub] = { equip: 0, parc: 0 };
                            contagemSub[sub].equip += (dado.equipamentos || 0);
                            contagemSub[sub].parc += (dado.parcerias || 0);
                        }
                    } else {
                        naoLocalizados.push(`Distrito '${dado.distrito}'`);
                    }
                }
            });

            if (naoLocalizados.length > 0) console.warn('[Não localizados]', naoLocalizados);

            if (currentState === 0) renderizarSubprefeituras(); 
            else if (currentState === 1) renderizarDistritos(subprefeituraAtual);
        }

        async function carregarArquivosGeoJSON() {
            try {
                const resDist = await fetch(urlDistritos);
                distritosGeoJSON = await resDist.json();
                distritosGeoJSON.features.forEach(f => {
                    if (f.properties.nm_distrito_municipal) distritosCanonicos[f.properties.nm_distrito_municipal.toLowerCase()] = f.properties.nm_distrito_municipal;
                });
                geoJSONPronto = true;
                renderizarSubprefeituras(); 
                if (mensagemPendente) { processarDadosCEUs(mensagemPendente); mensagemPendente = null; }
            } catch(e) { console.error("Erro GeoJSON:", e); }
        }

        carregarArquivosGeoJSON();

        window.addEventListener('message', function(event) {
            if (event.data && Array.isArray(event.data)) {
                if (geoJSONPronto) processarDadosCEUs(event.data);
                else mensagemPendente = event.data;
            }
        });

        function renderizarSubprefeituras() {
            fetch(urlSubprefeituras).then(res => res.json()).then(data => {
                if (subprefeiturasLayer) map.removeLayer(subprefeiturasLayer);
                badgesSub.clearLayers();

                subprefeiturasLayer = L.geoJSON(data, {
                    style: f => estiloRegiao(f, true),
                    onEachFeature: function (feature, layer) {
                        layer.on('mouseover', () => layer.setStyle(estiloHover(feature, true)));
                        layer.on('mouseout', () => subprefeiturasLayer.resetStyle(layer));

                        const nomeSub = feature.properties.name; 
                        const stats = contagemSub[nomeSub];
                        if (temDadosNoLocal(stats)) {
                            L.marker(layer.getBounds().getCenter(), { icon: criarBadgeIcon(stats), interactive: false }).addTo(badgesSub);
                        }

                        layer.on('click', function (e) {
                            L.DomEvent.stopPropagation(e);
                            subprefeituraAtual = nomeSub;
                            boundsSubprefeituraAtual = e.target.getBounds();
                            map.removeLayer(subprefeiturasLayer);
                            badgesSub.removeFrom(map);
                            map.fitBounds(boundsSubprefeituraAtual);
                            renderizarDistritos(nomeSub);
                        });
                        layer.bindTooltip(nomeSub, { sticky: true, className: 'dark-tooltip' });
                    }
                }).addTo(map);

                // CONTROLE DE ZOOM NA INICIALIZAÇÃO
                if (primeiraRenderizacao) { 
                    map.fitBounds(subprefeiturasLayer.getBounds(), { padding: [20, 20] }); 
                    map.zoomIn(0.5); // Aproxima 1 nível mantendo o enquadramento centralizado
                    primeiraRenderizacao = false; 
                }
            });
        }

        function renderizarDistritos(nomeSubClicada) {
            currentState = 1;
            if (distritosLayer) map.removeLayer(distritosLayer);
            badgesDist.clearLayers();

            distritosLayer = L.geoJSON(distritosGeoJSON, {
                filter: f => buscarSubprefeitura(f.properties.nm_distrito_municipal) === nomeSubClicada,
                style: f => estiloRegiao(f, false),
                onEachFeature: function (feature, layer) {
                    layer.on('mouseover', () => layer.setStyle(estiloHover(feature, false)));
                    layer.on('mouseout', () => distritosLayer.resetStyle(layer));

                    const nomeDistrito = feature.properties.nm_distrito_municipal;
                    const stats = contagemDist[nomeDistrito];
                    
                    if (temDadosNoLocal(stats)) {
                        L.marker(layer.getBounds().getCenter(), { icon: criarBadgeIcon(stats), interactive: false }).addTo(badgesDist);
                    }

                    layer.on('click', function (e) {
                        L.DomEvent.stopPropagation(e);
                        if (temDadosNoLocal(stats)) mostrarAreaInterna(nomeDistrito, e.target.getBounds(), stats);
                        else map.fitBounds(e.target.getBounds());
                    });
                    layer.bindTooltip(nomeDistrito, { sticky: true });
                }
            }).addTo(map);
            badgesDist.addTo(map);
        }

        function mostrarAreaInterna(nomeDistrito, boundsDistrito, stats) {
            currentState = 2;
            badgesDist.removeFrom(map);
            map.fitBounds(boundsDistrito);
            pinsCeu.clearLayers();

            if (modoVisualizacao === 'detalhado') {
                const ceusDeste = ceusData.filter(c => c.distrito === nomeDistrito);
                let gerouPin = false;

                ceusDeste.forEach(ceu => {
                    if (ceu.lat && ceu.lng) {
                        L.marker([ceu.lat, ceu.lng]).bindPopup(`<strong>${ceu.nome||'CEU'}</strong><br>${ceu.distrito}`).addTo(pinsCeu);
                        gerouPin = true;
                    }
                });

                if (gerouPin) {
                    pinsCeu.addTo(map);
                } else {
                    const html = `<strong>${nomeDistrito}</strong><ul style="margin:4px 0 0 -18px;color:#333;">` + 
                                 ceusDeste.map(c => `<li>${c.nome||'CEU'}</li>`).join('') + `</ul>`;
                    popupAtual = L.popup({ autoClose: false, closeOnClick: false }).setLatLng(boundsDistrito.getCenter()).setContent(html).openOn(map);
                }
            } else {
                const html = `
                    <div style="text-align:center;">
                        <strong style="font-size:14px; color:#00506E;">${nomeDistrito}</strong><hr style="margin:5px 0;">
                        🏢 Equipamentos: <b>${stats.equip || 0}</b><br>
                        🤝 Parcerias: <b>${stats.parc || 0}</b>
                    </div>`;
                popupAtual = L.popup({ autoClose: false, closeOnClick: false }).setLatLng(boundsDistrito.getCenter()).setContent(html).openOn(map);
            }
        }

        map.on('click', function () {
            if (currentState === 2) {
                currentState = 1;
                if (popupAtual) { map.closePopup(popupAtual); popupAtual = null; }
                map.removeLayer(pinsCeu); 
                badgesDist.addTo(map);
                map.fitBounds(boundsSubprefeituraAtual);
            } else if (currentState === 1) {
                currentState = 0;
                if (distritosLayer) map.removeLayer(distritosLayer);
                badgesDist.removeFrom(map);
                subprefeiturasLayer.addTo(map);
                badgesSub.addTo(map);
                
                // Reaplica o zoom inicial ao voltar para a visualização principal
                map.fitBounds(subprefeiturasLayer.getBounds(), { padding: [20, 20] });
                map.zoomIn(1);
            }
        });
    </script>
</body>
</html>
